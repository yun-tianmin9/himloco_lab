seed: 1
device: cuda:0
num_steps_per_env: 100
max_iterations: 15000
empirical_normalization: null
save_interval: 100
experiment_name: bpx_rough
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-09-20_18-52-42
load_checkpoint: model_200.pt
class_name: HIMOnPolicyRunner
policy_class_name: HIMActorCritic
algorithm_class_name: HIMPPO
policy:
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 1.0
  normalize_obs: false
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.01
  learning_rate: 0.001
  max_grad_norm: 1.0
  use_clipped_value_loss: true
  schedule: adaptive
  desired_kl: 0.01
history_length: 5
privileged_history_length: 0
